run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - gosimple
    - govet
    - ineffassign
  disable:
    - errcheck
    - staticcheck
    - unused
    - deadcode
    - gofmt
    - goimports

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosimple
        - govet
        - staticcheck
        - unused
    # Exclude errcheck for common patterns where ignore is intentional
    - text: "Error return value of .* is not checked"
      linters:
        - errcheck
    - text: "S1039"
      linters:
        - gosimple
    - text: "SA4006"
      linters:
        - staticcheck
